version: '3.8'

services:
  web:
    build: .
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://transpulse_user:secure_password@db:5432/transpulse_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transpulse_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - transpulse_network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=transpulse_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=transpulse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transpulse_user -d transpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transpulse_network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transpulse_network

networks:
  transpulse_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

